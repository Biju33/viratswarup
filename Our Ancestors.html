      /* --- HEADER --- */
      .site-header {
          background-color: #8b0000;
          color: white;
          padding: 8px 15px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          width: 100%;
          /* --- KEY CHANGE FOR GUARANTEED FROZEN HEADER --- */
          position: fixed; /* Changed from 'sticky' to 'fixed' for absolute positioning */
          top: 0;
          left: 0; /* Added for cross-browser consistency with position:fixed */
          z-index: 900;
          /* ----------------------------------------------- */
          border-bottom: 1px solid #7a0000;
          box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .header-left-section { display: flex; align-items: center; }
      .site-logo { height: 45px; margin-right: 12px; }
      .site-titles { display: flex; flex-direction: column; justify-content: center; }

      .header-right-section { display: flex; align-items: center; gap: 12px; }
      
      /* --- LANGUAGE SWITCHER (HEADER) --- */
      .language-selector-wrapper { position: relative; }
      .header-language-switcher {
          display: flex; align-items: center; border: 1px solid rgba(255, 255, 255, 0.5);
          border-radius: 4px; padding: 6px 8px; cursor: pointer; color: white; gap: 5px;
          background-color: rgba(0,0,0,0.1); transition: background-color 0.2s;
      }
      .header-language-switcher:hover { background-color: rgba(0,0,0,0.2); }
      .header-language-switcher .fas { font-size: 14px; }
      .header-language-switcher .lang-abbr { font-size: 13px; font-weight: 500; text-transform: uppercase; }
      .language-dropdown {
          display: none; position: absolute; top: calc(100% + 5px); right: 0; background-color: #800000;

      .language-dropdown.active { display: block; }
      .language-dropdown a { display: block; padding: 8px 15px; color: white; text-decoration: none; font-size: 13px; }
      .language-dropdown a:hover { background-color: rgba(255, 255, 255, 0.1); }
      .language-dropdown a.lang-active { font-weight: bold; background-color: rgba(0, 0, 0, 0.2); }

      /* --- HAMBURGER & MOBILE MENU --- */
      .hamburger {
        cursor: pointer;
        display: none;
        width: 28px; height: auto; padding: 5px 0; z-index: 1001;
      }
      .hamburger-line {
        width: 28px; height: 2px; background: #ffffff;
        margin: 6px 0; transition: 0.4s;
      }
      .hamburger.active .hamburger-line:nth-child(1) { transform: rotate(-45deg) translate(-5px, 6px); }
      .hamburger.active .hamburger-line:nth-child(2) { opacity: 0; }
      .hamburger.active .hamburger-line:nth-child(3) { transform: rotate(45deg) translate(-5px, -6px); }

      .mobile-menu {
        position: fixed; top: 0; right: -300px; width: 300px; max-width: 80%; height: 100%;
        background: #8b0000; box-shadow: -2px 0 15px rgba(0, 0, 0, 0.1);
        transition: right 0.4s ease-in-out; padding-top: 20px;
        z-index: 1000; overflow-y: auto;
      }
      .mobile-menu.active { right: 0; }
      .mobile-menu a {
        display: flex; align-items: center; gap: 15px; padding: 15px 30px;
        color: #fff !important; text-decoration: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer;
      }
      .mobile-menu i { width: 25px; font-size: 20px; color: #fff !important; }

      /* --- DESKTOP NAVIGATION --- */
      .desktop-nav {
        margin: 0 auto 30px auto;
        text-align: center;
        padding-top: 30px;
      }
      .desktop-nav ul { display: inline-flex; justify-content: center; gap: 32px; list-style: none; }
      .desktop-nav a {
        color: #8b0000; text-decoration: none; display: flex; align-items: center;
        gap: 8px; font-size: 18px; padding: 5px 10px; border-radius: 5px; transition: background-color 0.2s, color 0.2s;
      }
      .desktop-nav a:hover {
        background-color: #8b0000;
        color: white;
      }
      
      /* --- MAIN CONTENT & RISHI LIST --- */
      .container {
        max-width: 980px;
        margin: 0 auto;
        padding: 0 20px 20px 20px;
      }
      .content-section {
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08)
      }
      .section-title{text-align:center; color:#8b0000; font-size:28px; margin-bottom:15px;}
      .intro-text{text-align:center; color:#444; margin-bottom:25px; line-height:1.7; max-width: 700px; margin-left: auto; margin-right: auto;}
      .rishi-list{list-style:none; padding:0; margin:0}
      .rishi-item{padding:15px 10px; border-bottom:1px solid #eee}
      .rishi-item:last-child{border-bottom:none}
      .rishi-name{font-weight:700; color:#8b0000; font-size:18px;}
      .rishi-contribution{color:#333; margin-top:8px; line-height:1.6; font-size: 15px;}
      .translation-note{font-size:13px; color:#666; margin-top:20px; text-align: center; font-style: italic;}


      /* --- BOTTOM NAVIGATION (MOBILE) --- */
      .bottom-nav {
        position: fixed; bottom: 0; left: 0; width: 100%; background: #8b0000;
        border-top: 1px solid #7a0000; padding: 5px 0; display: none; z-index: 899;
        box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      }
      .bottom-nav ul { display: flex; justify-content: space-around; list-style: none; }
      .bottom-nav a {
        color: #fff !important; font-size: 16px; text-decoration: none; display: flex;
        flex-direction: column; align-items: center; gap: 4px; padding: 8px 10px;
        border-radius: 8px; transition: background 0.2s; flex: 1; text-align: center;
      }
      .bottom-nav a i { font-size: 20px; }
      .bottom-nav a span { font-size: 12px; }
      .bottom-nav a:hover { background-color: rgba(255, 255, 255, 0.1); }

      /* --- RESPONSIVE MEDIA QUERIES FOR MOBILE --- */
      @media (max-width: 768px) {
        body { padding-top: 57px; } 
        .hamburger { display: block; }
        .desktop-nav { display: none; }
        .bottom-nav { display: flex; }
        
        .site-header { padding: 8px 10px; }
        .site-main-title { font-size: 17px; }
        .site-subtitle { font-size: 10px; }
        .site-logo { height: 40px; margin-right: 8px; }

        .header-language-switcher { padding: 5px 7px; gap: 4px; }
        .header-language-switcher .fas, .header-language-switcher .lang-abbr { font-size: 12px; }
        .header-right-section { gap: 8px; }

        .container {
            padding: 20px 15px;
        }
        .content-section {
            padding: 20px 15px;
        }
        .section-title{ font-size:22px; }
        .intro-text { font-size: 15px; line-height: 1.6; }
        .rishi-name { font-size: 17px; }
        .rishi-contribution { font-size: 14px; }
      }
    </style>

    <script>
    document.addEventListener("DOMContentLoaded", function() {

        // --- ELEMENTS ---
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');
        const langSwitcher = document.getElementById('headerLangSwitcher');
        const langDropdown = document.getElementById('headerLangDropdown');
        const langLinks = langDropdown.querySelectorAll('a[data-lang]');
        const langAbbr = document.getElementById('langAbbr');
        
        // --- MOBILE MENU TOGGLE ---
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
        });

        // --- LANGUAGE SWITCHER LOGIC ---
        langSwitcher.addEventListener('click', (event) => {
            event.stopPropagation();
            langDropdown.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            if (langDropdown.classList.contains('active')) {
                langDropdown.classList.remove('active');
            }
        });

        langLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const selectedLang = this.getAttribute('data-lang');
                setLanguage(selectedLang);
                langDropdown.classList.remove('active');
            });
        });

        function setLanguage(lang) {
            renderList(lang);
            langAbbr.textContent = lang;
            localStorage.setItem('selectedLanguage', lang);
            
            langLinks.forEach(link => {
                link.classList.toggle('lang-active', link.getAttribute('data-lang') === lang);
            });
        }

        // --- RISHI DATA AND RENDERING ---
        const rishis = [
            {id:1, en:{name:"Bhrigu", contrib:"Author of Bhrigu Samhita; early astrological works and Vedic hymns."}, hi:{name:"भृगु", contrib:"भृगु संहिता के रचयिता; प्रारम्भिक ज्योतिष और वैदिक सूक्तों के योगदानकर्ता।"}, ne:{name:"भृगु", contrib:"भृगु संहिता का लेखक; प्रारम्भिक ज्योतिष र वैदिक सूक्तमा योगदान।"}},
            {id:2, en:{name:"Angiras", contrib:"Composer of Vedic hymns and teacher of sacred knowledge."}, hi:{name:"अंगिरस", contrib:"वैदिक सूक्तों के रचयिता और पवित्र ज्ञान के आचार्य।"}, ne:{name:"अंगिरस", contrib:"वैदिक सूक्तहरूको रचयिता र पवित्र ज्ञानका गुरु।"}},
            {id:3, en:{name:"Atri", contrib:"Contributor to Rigveda; known for tapasya and spiritual power."}, hi:{name:"अत्रि", contrib:"ऋग्वेद में योगदानकर्ता; तपस्या और आध्यात्मिक शक्ति के लिए प्रसिद्ध।"}, ne:{name:"अत्रि", contrib:"ऋग्वेदमा योगदान गर्ने; तपस्या र आध्यात्मिक शक्तिका लागि परिचित।"}},
            {id:4, en:{name:"Vasishtha", contrib:"Vedic sage; guru of Lord Rama; author of many hymns."}, hi:{name:"वशिष्ठ", contrib:"वैदिक ऋषि; भगवान राम के गुरु; अनेक सूक्तों के रचयिता।"}, ne:{name:"वशिष्ठ", contrib:"वैदिक ऋषि; भगवान रामका गुरु; धेरै सूक्तका लेखक।"}},
            {id:5, en:{name:"Kashyapa", contrib:"Progenitor of many beings; contributor to Vedic literature."}, hi:{name:"कश्यप", contrib:"बहु प्राणियों के कुलोत्पन्नकर्ता; वैदिक साहित्य में योगदान।"}, ne:{name:"कश्यप", contrib:"धेरै प्राणीहरूको वंशज; वैदिक साहित्यमा योगदान।"}},
            {id:6, en:{name:"Gautama", contrib:"Author of Nyaya Sutras; founder of logical school Nyaya."}, hi:{name:"गौतम", contrib:"न्याय सूत्रों के रचयिता; न्याय दर्शन के संस्थापक।"}, ne:{name:"गौतम", contrib:"न्याय सूत्रका लेखक; न्याय दर्शनको संस्थापक।"}},
            {id:7, en:{name:"Bharadwaja", contrib:"Scholar, contributed to Rigveda; known for knowledge in Ayurveda and sciences."}, hi:{name:"भरद्वाज", contrib:"वैदिक विद्वान; आयुर्वेद और विज्ञानों में विशेषज्ञता।"}, ne:{name:"भरद्वाज", contrib:"वैदिक विद्वान; आयुर्वेद र विज्ञानमा विज्ञ।"}},
            {id:8, en:{name:"Vishwamitra", contrib:"Composer of many hymns incl. Gayatri; became Brahmarishi through tapasya."}, hi:{name:"विश्वामित्र", contrib:"गायत्री समेत कई सूक्तों के रचयिता; तपस्या से ब्रह्मर्षि बने।"}, ne:{name:"विश्वामित्र", contrib:"गायत्री लगायत धेरै सूक्तका लेखक; तपस्याबाट ब्रह्मर्षि बने।"}},
            {id:9, en:{name:"Agastya", contrib:"Spread Vedic culture to south; founder of Siddha traditions."}, hi:{name:"अगस्त्य", contrib:"दक्षिण में वैदिक संस्कृति का प्रचार; सिद्ध परंपराओं के संस्थापक।"}, ne:{name:"अगस्त्य", contrib:"दक्षिणतिर वैदिक संस्कृति फैलाउँदै गएका; सिद्ध परम्पराका संस्थापक।"}},
            {id:10, en:{name:"Jamadagni", contrib:"Vedic scholar; father of Parashurama and holder of great penance."}, hi:{name:"जमदग्नि", contrib:"वैदिक विद्वान; परशुराम के पिता; तपस्या और ज्ञान के धनी।"}, ne:{name:"जमदग्नि", contrib:"वैदिक विद्वान; परशुरामका पिताजी; महान तपस्याका धनी।"}},
            {id:11, en:{name:"Kanva", contrib:"Adoptive father of Shakuntala; contributed Rigvedic hymns."}, hi:{name:"कन्व", contrib:"शकुंतला के गोद लिए हुए पिता; ऋग्वैदिक सूक्तों में योगदान।"}, ne:{name:"कन्व", contrib:"शकुंतलाका दत्त पिता; ऋग्वैदिक सूक्तमा योगदान।"}},
            {id:12, en:{name:"Parashara", contrib:"Author of Vishnu Purana; pioneer in astrology."}, hi:{name:"पराशर", contrib:"विष्णु पुराण के रचयिता; ज्योतिष के पुरोधा।"}, ne:{name:"पराशर", contrib:"विष्णु पुराणका लेखक; ज्योतिषमा पायनियर।"}},
            {id:13, en:{name:"Valmiki", contrib:"Author of Ramayana; called Adi Kavi (first poet)."}, hi:{name:"वाल्मीकि", contrib:"रामायण के लेखक; आदिकवि कहलाए।"}, ne:{name:"वाल्मीकि", contrib:"रामायणका लेखक; आदिकवि भनिन्छ।"}},
            {id:14, en:{name:"Vyasa", contrib:"Compiler of the Vedas; author of Mahabharata and Puranas."}, hi:{name:"व्यास", contrib:"वेदों के संकलनकर्ता; महाभारत और पुराणों के रचयिता।"}, ne:{name:"व्यास", contrib:"वेदहरूका सङ्कलक; महाभारत र पुराणका लेखक।"}},
            {id:15, en:{name:"Markandeya", contrib:"Author of Markandeya Purana; devotee of Shiva and long-lived sage."}, hi:{name:"मार्कण्डेय", contrib:"मार्कण्डेय पुराण के लेखक; शिव भक्त और अल्पमरण वाले ऋषि।"}, ne:{name:"मार्कण्डेय", contrib:"मार्कण्डेय पुराणका लेखक; शिवका भक्त र दीर्घायु ऋषि।"}},
            {id:16, en:{name:"Narada", contrib:"Divine messenger, master of bhakti and music."}, hi:{name:"नारद", contrib:"दैवीय संदेशवाहक; भक्ति एवं संगीत के उस्ताद।"}, ne:{name:"नारद", contrib:"दिव्य सन्देशवाहक; भक्ति र सङ्गीतका निपुण।"}},
            {id:17, en:{name:"Durvasa", contrib:"Known for ascetic power and stern temperament; powerful sage."}, hi:{name:"दुर्वासा", contrib:"कठोर तपस्वी और तीव्र स्वभाव के लिए प्रसिद्ध ऋषि।"}, ne:{name:"दुर्वासा", contrib:"कठोर तपस्वी र कडा स्वभावका लागि प्रसिद्ध।"}},
            {id:18, en:{name:"Yajnavalkya", contrib:"Philosopher in Brihadaranyaka Upanishad; taught neti-neti."}, hi:{name:"याज्ञवल्क्य", contrib:"बृहदारण्यक उपनिषद् के फ़िलॉसफ़र; नेति-नेति शिक्षा दी।"}, ne:{name:"याज्ञवल्क्य", contrib:"बृहदारण्यक उपनिषद्का दार्शनिक; नेति-नेति सिकाए।"}},
            {id:19, en:{name:"Uddalaka Aruni", contrib:"Taught 'Tat Tvam Asi' in Chandogya Upanishad."}, hi:{name:"उदडालक अरुणि", contrib:"चांदोघ्य उपनिषद् में 'तत्त्वमसि' की शिक्षा देने वाले।"}, ne:{name:"उद्दालक अरुणि", contrib:"चाण्डोग्य उपनिषद्मा 'तत्त्वमसि' सिकाउने।"}},
            {id:20, en:{name:"Shvetaketu", contrib:"Disciple of Uddalaka; central in Chandogya Upanishad teachings."}, hi:{name:"श्वेतकेतु", contrib:"उद्दालक के शिष्य; चाण्डोग्य उपनिषद के केन्द्रीय पात्र।"}, ne:{name:"श्वेतकेतु", contrib:"उद्दालकका शिष्य; चाण्डोग्य उपनिषद्का केन्द्रिय पात्र।"}},

        function renderList(lang = 'en') {
            const ul = document.getElementById('rishiList');
            if (!ul) return;
            ul.innerHTML = ''; 
            
            rishis.forEach(item => {
                const data = item[lang] || item.en; 
                const li = document.createElement('li');
                li.className = 'rishi-item';
                li.innerHTML = `
                    <div class="rishi-name">${item.id}. ${escapeHtml(data.name)}</div>
                    <div class="rishi-contribution">${escapeHtml(data.contrib)}</div>
                `;
                ul.appendChild(li);
            });

            const pageTitle = document.getElementById('page-title');
            const intro = document.getElementById('intro');
            const translationNote = document.getElementById('translation-note');

            if (lang === 'en') {
                pageTitle.textContent = '100 Great Rishi Munis of Ancient India';
                intro.textContent = 'The ancient sages of India made extraordinary contributions to spirituality, philosophy, science, and human civilization. Here we honor 100 of these enlightened beings and their timeless wisdom.';
                translationNote.textContent = 'Use the language selector in the header to change languages.';
            } else if (lang === 'hi') {
                pageTitle.textContent = 'प्राचीन भारत के 100 महान ऋषि-मुनि';
                intro.textContent = 'प्राचीन भारत के ऋषियों ने आध्यात्म, दर्शन, विज्ञान और मानव सभ्यता में असाधारण योगदान दिया। यहाँ हम 100 ऐसे बुद्धिमान मुनियों और उनके शाश्वत ज्ञान का सम्मान करते हैं।';
                translationNote.textContent = 'भाषा बदलने के लिए हेडर में भाषा चयनकर्ता का उपयोग करें।';
            } else if (lang === 'ne') {
                pageTitle.textContent = 'प्राचीन भारतका १०० महान ऋषि मुनिहरू';
                intro.textContent = 'प्राचीन भारतका ऋषिहरूले आध्यात्म, दर्शन, विज्ञान र मानव सभ्यतामा असाधारण योगदान दिए। यहाँ हामी यी १०० प्रबुद्ध प्राणीहरू र उनीहरूको कालातीत ज्ञानलाई सम्मान गर्दछौं।';
                translationNote.textContent = 'भाषा परिवर्तन गर्न हेडरमा भाषा चयनकर्ता प्रयोग गर्नुहोस्।';
            }
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
        }
        
        // --- INITIAL LOAD ---
        const savedLang = localStorage.getItem('selectedLanguage') || 'en';
        setLanguage(savedLang);
    });
    </script>
